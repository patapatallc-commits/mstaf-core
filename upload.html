<!DOCTYPE html>
<html>
<head>
  <title>PATAPATA Print-O-Matic Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
      color:white;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:100%;
      max-width:620px;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.18);
      border-radius:26px;
      padding:34px;
      box-shadow:0 25px 70px rgba(0,0,0,.45);
    }
    .logo{
      text-align:center;
      font-size:28px;
      font-weight:900;
      margin-bottom:8px;
    }
    .tagline{
      text-align:center;
      color:#cbd5e1;
      margin-bottom:28px;
      line-height:1.5;
    }
    label{
      display:block;
      margin:16px 0 8px;
      font-weight:700;
      color:#facc15;
    }
    input, textarea, select{
      width:100%;
      box-sizing:border-box;
      padding:14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.2);
      background:#020617;
      color:white;
      font-size:15px;
    }
    textarea{min-height:110px;resize:vertical}
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    button{
      width:100%;
      margin-top:24px;
      padding:16px;
      border:0;
      border-radius:16px;
      background:#2563eb;
      color:white;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
    }
    button:hover{background:#1d4ed8}
    .back{
      display:block;
      text-align:center;
      margin-top:18px;
      color:#93c5fd;
      text-decoration:none;
      font-weight:700;
    }
    .note{
      margin-top:18px;
      font-size:13px;
      color:#cbd5e1;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🇺🇸 PATAPATA PRINT-O-MATIC</div>
    <div class="tagline">
      Upload your document, image, flyer, ID photo, or design file.<br>
      Your job will appear instantly on our worker dashboard.
    </div>

    <form action="/api/upload" method="POST" enctype="multipart/form-data">
      <label>Choose File</label>
      <input type="file" name="file" required>

      <label>WhatsApp / Phone Number</label>
      <input type="text" name="customer_phone" placeholder="+18621234567">

      <div class="grid">
        <div>
          <label>Paper Size</label>
          <select name="paper_size">
            <option value="A4">A4</option>
            <option value="Letter">Letter</option>
            <option value="A3">A3</option>
            <option value="Legal">Legal</option>
            <option value="Tabloid">Tabloid</option>
            <option value="CARD">Card / ID</option>
          </select>
        </div>

        <div>
          <label>Color</label>
          <select name="color_mode">
            <option value="BW">Black & White</option>
            <option value="COLOR">Color</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Copies</label>
          <input type="number" name="copies" value="1" min="1">
        </div>

        <div>
          <label>Pages</label>
          <input type="number" name="pages" value="1" min="1">
        </div>
      </div>

      <label>Instructions</label>
      <textarea name="instructions" placeholder="Example: Print 2 copies in color, laminate after printing, or edit background..."></textarea>

      <button type="submit">Upload to Worker Dashboard</button>
    </form>

    <a class="back" href="/">← Back to Home</a>
    <div class="note">Powered by PATAPATA Print-O-Matic</div>
  </div>
</body>
</html>
