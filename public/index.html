<!DOCTYPE html>
<html>
<head>
  <title>PATAPATA Print-O-Matic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1200px;
    }

    .landing-img {
      width: 100%;
      display: block;
    }

 .hero-buttons {
  position: absolute;
  top: 60%;              /* move slightly down */
  left: 50%;
  transform: translateX(-50%);   /* ONLY horizontal centering */
  display: flex;
    flex-direction: row;      /* ADD */
  justify-content: center;  /* ADD */
  align-items: center;      /* ADD */
  gap: 15px;
  z-index: 10;
}

.btn {
  padding: 14px 22px;
  border-radius: 12px;
  font-weight: bold;
  text-decoration: none;
  color: white;
  font-size: 15px;
}

.upload-btn { background: #1e63ff; }
.whatsapp-btn { background: #25D366; }
.cv-btn { background: linear-gradient(90deg,#9333ea,#7e22ce); }
.badge {
  font-size: 12px;
  font-weight: 600;
  color: #0b63ff;
  background: rgba(11, 99, 255, 0.12);
  padding: 5px 10px;
  border-radius: 999px;
}
    .service-card {
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.service-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.12);
}

    .hero-buttons {
  display: none !important;
}

.cv-flash {
  position: absolute;
  top: 56%;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(90deg, #9333ea, #7e22ce);
  color: #fff;
  padding: 14px 28px;
  border-radius: 999px;
  font-weight: 800;
  text-decoration: none;
  font-size: 16px;
  box-shadow: 0 0 25px rgba(147, 51, 234, 0.8);
  animation: flashPulse 1.2s infinite;
  z-index: 20;
}

@keyframes flashPulse {
  0% { opacity: 1; transform: translateX(-50%) scale(1); }
  50% { opacity: 0.65; transform: translateX(-50%) scale(1.06); }
  100% { opacity: 1; transform: translateX(-50%) scale(1); }
}
  </style>
</head>

<body>

<div class="container">

  <img src="/printomatic-landing.png" class="landing-img" />
  <a href="https://wa.me/18682372173?text=Hello%20I%20want%20to%20submit%20my%20CV%20for%20employment"
   class="cv-flash">
  💼 Submit CV for Employment
</a>
 

 

</div>

</body>
</html>
