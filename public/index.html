<!DOCTYPE html>
<html>
<head>
  <title>PATAPATA Print-O-Matic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Arial, sans-serif;
      width: 100%;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .landing-img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hotspot {
      position: absolute;
      z-index: 9999;
      display: block;
      background: transparent;
      cursor: pointer;
    }

    /* Desktop */
    .top-upload { left: 31%; top: 41.5%; width: 18%; height: 8%; }
    .top-whatsapp { left: 49.5%; top: 41.5%; width: 21%; height: 8%; }

    .card-upload { left: 8.5%; top: 89.5%; width: 14%; height: 6%; }
    .card-laminate { left: 30.5%; top: 89.5%; width: 16%; height: 6%; }
    .card-image { left: 52%; top: 89.5%; width: 15%; height: 6%; }
    .card-video { left: 74%; top: 89.5%; width: 16%; height: 6%; }

    .cv-flash {
      position: absolute;
      top: 61%;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg,#9333ea,#7e22ce);
      color: #fff;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      font-size: 16px;
      box-shadow: 0 0 25px rgba(147,51,234,.8);
      animation: flashPulse 1.2s infinite;
      z-index: 10000;
      white-space: nowrap;
    }

    @keyframes flashPulse {
      0% { opacity: 1; transform: translateX(-50%) scale(1); }
      50% { opacity: .8; transform: translateX(-50%) scale(1.05); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .container {
        width: 100%;
        max-width: none;
      }

      .landing-img {
        width: 100%;
        height: auto;
      }

      .cv-flash {
        top: 55%;
        font-size: 12px;
        padding: 10px 16px;
        max-width: 85%;
        text-align: center;
      }

      .top-upload { left: 30%; top: 35.5%; width: 20%; height: 6%; }
      .top-whatsapp { left: 49%; top: 35.5%; width: 22%; height: 6%; }

      .card-upload { left: 8%; top: 83%; width: 15%; height: 5%; }
      .card-laminate { left: 30%; top: 83%; width: 16%; height: 5%; }
      .card-image { left: 51%; top: 83%; width: 16%; height: 5%; }
      .card-video { left: 73%; top: 83%; width: 17%; height: 5%; }
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="/printomatic-landing.png" class="landing-img" />

    <!-- DIRECT SERVICE LINKS (FIXED) -->

    <!-- Upload & Print -->
    <a class="hotspot top-upload"
       href="https://wa.me/18622306637?text=Hello%20I%20want%20to%20upload%20and%20print%20my%20document"
       target="_blank"></a>

    <!-- Chat -->
    <a class="hotspot top-whatsapp"
       href="https://wa.me/18622306637?text=Hello%20PATAPATA%20Print-O-Matic"
       target="_blank"></a>

    <!-- Cards -->
    <a class="hotspot card-upload"
       href="https://wa.me/18622306637?text=Hello%20I%20want%20to%20upload%20and%20print%20my%20document"
       target="_blank"></a>

    <a class="hotspot card-laminate"
       href="https://wa.me/18622306637?text=Hello%20I%20want%20lamination%20service"
       target="_blank"></a>

    <a class="hotspot card-image"
       href="https://wa.me/18628372173?text=Hello%20I%20need%20image%20editing%20service"
       target="_blank"></a>

    <a class="hotspot card-video"
       href="https://wa.me/18628372173?text=Hello%20I%20need%20video%20editing%20service"
       target="_blank"></a>

    <!-- CV -->
    <a href="https://wa.me/18628372173?text=Hello%20I%20want%20to%20submit%20my%20CV"
       target="_blank"
       class="cv-flash">
      💼 Submit CV for Employment
    </a>

  </div>
</body>
</html>
