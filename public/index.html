  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Arial, sans-serif;
      width: 100%;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
    }

    .landing-img {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 1;
    }

    .hotspot {
      position: absolute;
      z-index: 9999;
      display: block;
      background: rgba(255,255,255,0);
      cursor: pointer;
    }

    /* Desktop zones */
    .top-upload { left: 31%; top: 41.5%; width: 18%; height: 8%; }
    .top-whatsapp { left: 49.5%; top: 41.5%; width: 21%; height: 8%; }

    .card-upload { left: 8.5%; top: 89.5%; width: 14%; height: 6%; }
    .card-laminate { left: 30.5%; top: 89.5%; width: 16%; height: 6%; }
    .card-image { left: 52%; top: 89.5%; width: 15%; height: 6%; }
    .card-video { left: 74%; top: 89.5%; width: 16%; height: 6%; }

    .cv-flash {
      position: absolute;
      top: 61%;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg,#9333ea,#7e22ce);
      color: #fff;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      font-size: 16px;
      box-shadow: 0 0 25px rgba(147,51,234,.8);
      animation: flashPulse 1.2s infinite;
      z-index: 10000;
      white-space: nowrap;
    }

    @keyframes flashPulse {
      0% { opacity: 1; transform: translateX(-50%) scale(1); }
      50% { opacity: .8; transform: translateX(-50%) scale(1.05); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    /* Mobile */
    @media (max-width: 700px) {
      .container {
        width: 100%;
        max-width: none;
      }

      .landing-img {
        width: 100%;
        height: auto;
      }

      .cv-flash {
        top: 55%;
        font-size: 12px;
        padding: 10px 16px;
        max-width: 85%;
        text-align: center;
      }

      .top-upload { left: 30%; top: 35.5%; width: 20%; height: 6%; }

      .card-image { left: 51%; top: 83%; width: 16%; height: 5%; }

    }
