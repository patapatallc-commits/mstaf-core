<!DOCTYPE html>
<html>
<head>
  <title>PATAPATA Print-O-Matic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1200px;
    }

    .landing-img {
      width: 100%;
      display: block;
    }

    /* BUTTON BASE */
    .btn {
      position: absolute;
      padding: 16px 28px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      color: white;
      font-size: 16px;
      text-align: center;
      white-space: nowrap;
    }

    /* TOP HERO BUTTONS (ONLY ONES THAT REMAIN) */
    .upload-btn {
      background: #2563eb;
      top: 44%;
      left: 32%;
    }

    .whatsapp-btn {
      background: #22c55e;
      top: 44%;
      left: 52%;
    }

    .cv-btn {
      background: #9333ea;
      top: 44%;
      left: 72%;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .upload-btn {
        top: 50%;
        left: 10%;
        padding: 12px 16px;
      }

      .whatsapp-btn {
        top: 50%;
        left: 40%;
        padding: 12px 16px;
      }

      .cv-btn {
        top: 50%;
        left: 70%;
        padding: 12px 16px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- IMAGE -->
  <img src="/printomatic-landing.png" class="landing-img" />

  <!-- ONLY THESE 3 BUTTONS EXIST NOW -->

  <a href="/upload.html" class="btn upload-btn">
    Upload & Print
  </a>

  <a href="https://wa.me/18682372173" class="btn whatsapp-btn">
    Chat on WhatsApp
  </a>

  <a href="https://wa.me/18682372173?text=Hello%20I%20want%20to%20submit%20my%20CV"
     class="btn cv-btn">
    Submit CV
  </a>

</div>

</body>
</html>
