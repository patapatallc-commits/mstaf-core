<!DOCTYPE html>
<html>
<head>
  <title>PATAPATA Print-O-Matic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1200px;
    }

    .landing-img {
      width: 100%;
      display: block;
    }

    /* CV BUTTON ONLY (no duplicates) */
    .cv-btn {
      position: absolute;
      top: 62%; /* BELOW existing image buttons */
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 28px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      color: white;
      font-size: 16px;
      background: linear-gradient(90deg,#9333ea,#7e22ce);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .cv-btn:hover {
      opacity: 0.9;
      transform: translateX(-50%) translateY(-2px);
    }

    @media (max-width: 768px) {
      .cv-btn {
        top: 65%;
        padding: 12px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <img src="/printomatic-landing.png" class="landing-img" />

  <!-- ONLY CV BUTTON -->
  <a href="https://wa.me/18682372173?text=Hello%20I%20want%20to%20submit%20my%20CV"
     class="cv-btn">
     Submit CV
  </a>

</div>

</body>
</html>
