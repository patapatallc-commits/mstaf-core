<!DOCTYPE html>
<html>
<head>
  <title>PATAPATA Print-O-Matic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1200px;
    }

    .landing-img {
      width: 100%;
      display: block;
    }

    /* BUTTON OVERLAYS */
    .btn {
      position: absolute;
      padding: 16px 28px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      color: white;
      font-size: 16px;
    }

    .upload-btn {
      background: #1e63ff;
      top: 52%;
      left: 35%;
    }

    .whatsapp-btn {
      background: #25D366;
      top: 52%;
      left: 52%;
    }

    @media (max-width: 768px) {
      .upload-btn {
        top: 55%;
        left: 20%;
        padding: 12px 18px;
      }

      .whatsapp-btn {
        top: 55%;
        left: 55%;
        padding: 12px 18px;
      }
    }
    /* FORCE ALL BUTTONS TO BLUE */
a,
button,
[class*="btn"] {
  background: linear-gradient(90deg, #2563eb, #1d4ed8) !important;
  color: #fff !important;
  border: none !important;
}
  </style>
</head>

<body>

<div class="container">

  <!-- EXACT IMAGE -->
  <img src="/printomatic-landing.png" class="landing-img" />

  <!-- BUTTONS -->
  <a href="https://www.patapata.us/pages/print-documents-images"
     class="btn upload-btn">
     Upload & Print
  </a>

  <a href="https://wa.me/18682372173"
     class="btn whatsapp-btn">
     Chat on WhatsApp
  </a>

</div>

</body>
</html>
