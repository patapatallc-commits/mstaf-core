<!DOCTYPE html>
<html>
<head>
  <title>PATAPATA Print-O-Matic Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
      color:white;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card{
      width:100%;
      max-width:600px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:20px;
      padding:30px;
      backdrop-filter:blur(10px);
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    h2{text-align:center;margin-bottom:20px;}
    input, textarea{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      outline:none;
      font-size:14px;
      box-sizing:border-box;
    }
    textarea{min-height:90px;}
    button{
      width:100%;
      padding:14px;
      margin-top:20px;
      border:none;
      border-radius:12px;
      background:linear-gradient(90deg,#22c55e,#16a34a);
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }
    button:hover{opacity:0.9;}
    .file-box{
      border:2px dashed rgba(255,255,255,0.4);
      padding:28px;
      text-align:center;
      border-radius:12px;
      margin-top:10px;
      cursor:pointer;
      transition:0.2s;
    }
    .file-box:hover{border-color:#22c55e;}
  </style>
</head>

<body>
  <div class="card">
    <h2>Upload File to Print-O-Matic</h2>

    <form action="/api/upload" method="POST" enctype="multipart/form-data">
      <div class="file-box" id="dropZone">
        <p id="fileText">📂 Drag & Drop file here or click to upload</p>
        <input type="file" name="file" id="fileInput" required hidden>
      </div>

      <input type="text" name="customer_phone" placeholder="Phone number">
      <textarea name="instructions" placeholder="Instructions"></textarea>
      <button type="submit">Upload File</button>
    </form>
  </div>

  <script>
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const fileText = document.getElementById("fileText");

    function showFileName(file) {
      if (!file) return;
      fileText.textContent = "✅ " + file.name;
    }

    dropZone.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      showFileName(fileInput.files[0]);
    });

    ["dragenter", "dragover"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.style.borderColor = "#22c55e";
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.style.borderColor = "rgba(255,255,255,0.4)";
      });
    });

    dropZone.addEventListener("drop", (e) => {
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        fileInput.files = files;
        showFileName(files[0]);
      }
    });
  </script>
</body>
</html>
