<!DOCTYPE html>
<html>
<head>
  <title>PATAPATA Print-O-Matic Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
      color:white;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      box-sizing:border-box;
    }

    .card{
      width:100%;
      max-width:600px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:20px;
      padding:30px;
      backdrop-filter:blur(10px);
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }

    h2{text-align:center;margin-bottom:20px;}

    input, textarea{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      outline:none;
      font-size:14px;
      box-sizing:border-box;
    }

    textarea{min-height:90px;}

    button{
      width:100%;
      padding:14px;
      margin-top:20px;
      border:none;
      border-radius:12px;
      background:linear-gradient(90deg,#22c55e,#16a34a);
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .file-box{
      border:2px dashed rgba(255,255,255,0.4);
      padding:28px;
      text-align:center;
      border-radius:12px;
      margin-top:10px;
      cursor:pointer;
      background:rgba(255,255,255,0.05);
    }

    .hint{
      font-size:12px;
      opacity:0.85;
      margin-top:8px;
      line-height:1.5;
    }

    .success{
      display:none;
      background:rgba(34,197,94,0.15);
      border:1px solid rgba(34,197,94,0.5);
      padding:14px;
      border-radius:12px;
      margin-top:15px;
      text-align:center;
      font-weight:bold;
    }

    .error{
      display:none;
      background:rgba(239,68,68,0.15);
      border:1px solid rgba(239,68,68,0.5);
      padding:14px;
      border-radius:12px;
      margin-top:15px;
      text-align:center;
      font-weight:bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Upload File to Print-O-Matic</h2>

    <form id="uploadForm" enctype="multipart/form-data">
      <div class="file-box" id="dropZone">
        <p id="fileText">📂 Tap here to choose PDF, document, or image</p>
        <div class="hint">
          On Android, choose <b>Files</b> or <b>Documents</b> for PDF uploads.
        </div>

        <input
          type="file"
          name="file"
          id="fileInput"
          required
          hidden
        >
      </div>

      <input
        type="text"
        name="customer_phone"
        placeholder="Phone number"
      >

      <textarea
        name="instructions"
        placeholder="Instructions"
      ></textarea>

      <button id="submitBtn" type="submit">Upload File</button>

      <div class="success" id="successBox">
        ✅ File uploaded successfully. Your job has been sent to the worker dashboard.
      </div>

      <div class="error" id="errorBox">
        ❌ Upload failed. Please try again.
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById("uploadForm");
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const fileText = document.getElementById("fileText");
    const submitBtn = document.getElementById("submitBtn");
    const successBox = document.getElementById("successBox");
    const errorBox = document.getElementById("errorBox");

    function showFileName(file) {
      if (!file) return;
      fileText.textContent = "✅ Selected: " + file.name;
    }

    dropZone.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      showFileName(fileInput.files[0]);
    });

    ["dragenter", "dragover"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.style.borderColor = "#22c55e";
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.style.borderColor = "rgba(255,255,255,0.4)";
      });
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();

      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        fileInput.files = files;
        showFileName(files[0]);
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      successBox.style.display = "none";
      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Uploading...";

      try {
        const formData = new FormData(form);

        const response = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Upload failed");
        }

        successBox.style.display = "block";
        form.reset();
        fileText.textContent = "📂 Tap here to choose PDF, document, or image";
      } catch (err) {
        errorBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Upload File";
      }
    });
  </script>
</body>
</html>
